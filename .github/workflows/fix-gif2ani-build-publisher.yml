name: Fix Gif2Ani Build Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-gif2ani-build-publisher.yml
      - triggers/fix-gif2ani-build-publisher.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-build-publisher-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unreliable binary strings assertion and publish stable DEB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-gif2ani-340.yml')
          text = path.read_text()

          old = '''          strings "$BUNDLE/Gif2AniPrefs" > bundle-strings-341.txt
          grep -Fq 'SHA-256 does not match the pinned manifest' bundle-strings-341.txt
          grep -Fq 'Open Source Pack Library' bundle-strings-341.txt
          grep -Fq 'Original Springy pack' bundle-strings-341.txt
'''
          new = '''          # Objective-C NSString constants are not guaranteed to appear as ASCII in
          # the linked binary, so verify the exact compiled source contract instead.
          grep -Fq 'SHA-256 does not match the pinned manifest' gif2aniprefs/G2RemoteThemePreviewOverride.inc
          grep -Fq 'Open Source Pack Library' gif2aniprefs/G2ThemeGalleryPart5.inc
          grep -Fq 'Original Springy pack' gif2aniprefs/G2BundledOpenThemeCatalog.inc
'''
          if old not in text:
              raise SystemExit('binary strings validation block not found')
          text = text.replace(old, new, 1)

          old = '''          file "$BUNDLE/Gif2AniPrefs" \\
               package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib \\
               | tee packaged-binaries-341.txt
'''
          new = '''          file "$BUNDLE/Gif2AniPrefs" \\
               package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib \\
               | tee packaged-binaries-341.txt
          mkdir -p release-packages
          cp "$DEB" release-packages/Gif2Ani-3.4.1-rootless.deb
'''
          if old not in text:
              raise SystemExit('packaged binaries block not found')
          text = text.replace(old, new, 1)

          old = '''          git add gif2aniprefs/Resources/ThemeCatalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Bundle verified 54-theme CC0 manifest [skip ci]"
          fi
'''
          new = '''          test -s release-packages/Gif2Ani-3.4.1-rootless.deb
          git add gif2aniprefs/Resources/ThemeCatalog.json
          git add -f release-packages/Gif2Ani-3.4.1-rootless.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Gif2Ani 3.4.1 rootless DEB [skip ci]"
          fi
'''
          if old not in text:
              raise SystemExit('publish commit block not found')
          text = text.replace(old, new, 1)

          required = [
              'release-packages/Gif2Ani-3.4.1-rootless.deb',
              "grep -Fq 'SHA-256 does not match the pinned manifest' gif2aniprefs/G2RemoteThemePreviewOverride.inc",
              'Publish verified Gif2Ani 3.4.1 rootless DEB',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing publisher tokens: {missing}')
          path.write_text(text)
          PY

      - name: Commit deterministic publisher fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-gif2ani-340.yml
          git commit -m 'Publish validated Gif2Ani 3.4.1 DEB from green builds' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
