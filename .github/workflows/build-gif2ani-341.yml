name: Build and Publish Gif2Ani 3.4.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gif2ani-341.yml
      - triggers/build-gif2ani-341.txt
      - control
      - Makefile
      - Tweak.xm
      - gif2aniprefs/**

permissions:
  contents: write

concurrency:
  group: gif2ani-341-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos toolchain
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git \
            libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file binutils
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Validate complete 114-theme source contract
        run: |
          set -euo pipefail
          test "$(awk '/^Version:/{print $2}' control)" = "3.4.1"
          test -f gif2aniprefs/G2ThemeGalleryController.m
          test -f gif2aniprefs/G2RemoteThemeCatalog.inc
          test -f gif2aniprefs/G2OpenThemeLibrary.inc
          test -f gif2aniprefs/G2BundledOpenThemeCatalog.inc
          test -f gif2aniprefs/G2RemoteThemePreviewOverride.inc
          test -f gif2aniprefs/G2ThemeStageOverride.inc
          test -f gif2aniprefs/Resources/ThemeCatalog.json
          test -f gif2aniprefs/Resources/OpenThemeCatalog.json
          grep -Fq 'GIF2ANI 3.4.1' gif2aniprefs/Resources/Root.plist
          grep -Fq '114-THEME ANIMATION GALLERY' gif2aniprefs/Resources/Root.plist
          grep -Fq '#include "G2BundledOpenThemeCatalog.inc"' gif2aniprefs/G2ThemeGalleryController.m
          grep -Fq '#include "G2OpenThemeLibrary.inc"' gif2aniprefs/G2ThemeGalleryController.m
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          cc0 = json.loads(Path('gif2aniprefs/Resources/ThemeCatalog.json').read_text())
          opened = json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())
          assert cc0['count'] == len(cc0['themes']) == 54
          assert opened['count'] == len(opened['themes']) == 48
          assert opened['sourceRepository'] == 'VirenMohindra/CydiaRepo'
          assert opened['sourceLicense'] == 'MIT'
          assert len({item['id'] for item in cc0['themes']}) == 54
          assert len({item['package'] for item in opened['themes']}) == 48
          for item in cc0['themes']:
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
              assert 0 < int(item['bytes']) <= 25 * 1024 * 1024
              assert item['license'] == 'CC0-1.0'
          for item in opened['themes']:
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
              assert 0 < int(item['bytes']) <= 32 * 1024 * 1024
              assert item['downloadURL'].startswith('https://virenmohindra.github.io/debs/')
              assert item.get('sourceLicense') == 'MIT'
          wrapper = Path('gif2aniprefs/G2ThemeGalleryController.m').read_text()
          preview = Path('gif2aniprefs/G2RemoteThemePreviewOverride.inc').read_text()
          openlib = Path('gif2aniprefs/G2OpenThemeLibrary.inc').read_text()
          stage = Path('gif2aniprefs/G2ThemeStageOverride.inc').read_text()
          for include in ['G2RemoteThemeCatalog.inc', 'G2BundledOpenThemeCatalog.inc',
                          'G2OpenThemeLibrary.inc', 'G2RemoteThemePreviewOverride.inc']:
              assert f'#include "{include}"' in wrapper
          assert 'G2RemoteDataMatchesManifest' in preview
          assert 'CC_SHA256' in preview
          assert 'G2PreflightArchive' in openlib
          assert 'G2ValidateExtractedTree' in openlib
          assert 'G2WriteGalleryPreferences(@{@"pendingReady":@YES}' in stage
          print('offline_themes=12')
          print('cc0_downloadable_themes=54')
          print('open_source_downloadable_themes=48')
          print('first_class_theme_total=114')
          PY

      - name: Build and validate rootless DEB
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build-341.log
          DEB='packages/com.nightvibes33.gif2ani_3.4.1_iphoneos-arm64.deb'
          test -s "$DEB"
          test "$(dpkg-deb --field "$DEB" Package)" = 'com.nightvibes33.gif2ani'
          test "$(dpkg-deb --field "$DEB" Version)" = '3.4.1'
          test "$(dpkg-deb --field "$DEB" Architecture)" = 'iphoneos-arm64'

          rm -rf package-root-341
          dpkg-deb -x "$DEB" package-root-341
          BUNDLE="$(find package-root-341 -type d -name Gif2AniPrefs.bundle -print -quit)"
          DYLIB='package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib'
          FILTER='package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist'
          test -n "$BUNDLE"
          test -s "$BUNDLE/Gif2AniPrefs"
          test -s "$DYLIB"
          test -s "$FILTER"
          test -f "$BUNDLE/Root.plist"
          test -f "$BUNDLE/ThemeCatalog.json"
          test -f "$BUNDLE/OpenThemeCatalog.json"
          grep -Fq 'GIF2ANI 3.4.1' "$BUNDLE/Root.plist"
          grep -Fq '114-THEME ANIMATION GALLERY' "$BUNDLE/Root.plist"

          python3 - "$BUNDLE/ThemeCatalog.json" "$BUNDLE/OpenThemeCatalog.json" <<'PY'
          import json, sys
          cc0 = json.load(open(sys.argv[1]))
          opened = json.load(open(sys.argv[2]))
          assert cc0['count'] == len(cc0['themes']) == 54
          assert opened['count'] == len(opened['themes']) == 48
          assert len({item['package'] for item in opened['themes']}) == 48
          print('packaged_cc0_manifest=54')
          print('packaged_open_manifest=48')
          print('packaged_downloadable_total=102')
          PY

          file "$BUNDLE/Gif2AniPrefs" "$DYLIB" | tee packaged-binaries-341.txt
          dpkg-deb --contents "$DEB" | tee package-contents-341.txt
          sha256sum "$DEB" | tee deb-sha256-341.txt
          mkdir -p release-packages
          cp "$DEB" release-packages/Gif2Ani-3.4.1-rootless.deb

      - name: Upload verified DEB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.4.1-rootless-deb
          path: release-packages/Gif2Ani-3.4.1-rootless.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish package and build status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p status release-packages
          {
            echo 'Gif2Ani 3.4.1 Deterministic Build'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_commit=${GITHUB_SHA}"
            echo "status=${JOB_STATUS}"
            echo "completed_at_utc=$(date -u +%FT%TZ)"
            if [ -s release-packages/Gif2Ani-3.4.1-rootless.deb ]; then
              echo 'package_path=release-packages/Gif2Ani-3.4.1-rootless.deb'
              echo "package_bytes=$(wc -c < release-packages/Gif2Ani-3.4.1-rootless.deb | tr -d ' ')"
              echo "package_sha256=$(sha256sum release-packages/Gif2Ani-3.4.1-rootless.deb | awk '{print $1}')"
            fi
            echo
            echo '--- packaged binaries ---'
            cat packaged-binaries-341.txt 2>/dev/null || true
            echo
            echo '--- package contents ---'
            cat package-contents-341.txt 2>/dev/null || true
            echo
            echo '--- build log tail ---'
            tail -n 300 build-341.log 2>/dev/null || true
          } > status/build-341.txt

          git add status/build-341.txt
          if [ -s release-packages/Gif2Ani-3.4.1-rootless.deb ]; then
            git add -f release-packages/Gif2Ani-3.4.1-rootless.deb
          fi
          git commit -m "Publish Gif2Ani 3.4.1 build ${JOB_STATUS} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
