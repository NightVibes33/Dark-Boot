name: Build Gif2Ani Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: gif2ani-rootless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git \
            libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file

      - name: Install Theos and SDK
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang
          test -n "$(find /opt/theos/sdks -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build rootless package
        id: compile
        env:
          THEOS: /opt/theos
        run: |
          set -uo pipefail
          : > build.log
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          echo "$DEB" > deb-path.txt
          dpkg-deb --info "$DEB" | tee -a build.log
          dpkg-deb --contents "$DEB" | tee package-contents.txt
          rm -rf package-root package-control
          dpkg-deb -x "$DEB" package-root
          dpkg-deb -e "$DEB" package-control

      - name: Validate package and crash-safety contract
        id: validate
        run: |
          set -euo pipefail
          DEB="$(cat deb-path.txt)"
          test "$(dpkg-deb --field "$DEB" Package)" = "com.nightvibes33.gif2ani"
          test "$(dpkg-deb --field "$DEB" Version)" = "3.1.0"
          test "$(dpkg-deb --field "$DEB" Architecture)" = "iphoneos-arm64"
          grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib' package-contents.txt
          grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist' package-contents.txt
          grep -q 'var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle/Gif2AniPrefs' package-contents.txt
          grep -q 'var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle/Root.plist' package-contents.txt
          grep -q 'var/jb/Library/PreferenceLoader/Preferences/Gif2Ani.plist' package-contents.txt
          test -x package-control/postinst
          test -x package-control/prerm
          file package-root/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib | grep -q 'arm64'
          strings package-root/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib | grep -q 'BKDisplayRenderOverlaySpinny'

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = plistlib.loads(
              Path('package-root/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle/Root.plist').read_bytes()
          )
          items = root.get('items')
          assert isinstance(items, list) and len(items) >= 12
          labels = {item.get('label') for item in items if isinstance(item, dict)}
          required = {
              'Enable After Apply',
              'Select and Stage GIF',
              'Remove Staged and Active GIF',
              'Scaling',
              'Background Color',
              'Loop Count',
              'Duration (Seconds)',
              'Apply and Respring',
          }
          assert not (required - labels), sorted(required - labels)
          enable = next(item for item in items if item.get('key') == 'isEnabled')
          assert enable.get('default') is False
          assert all('PostNotification' not in item for item in items if isinstance(item, dict))
          apply_item = next(item for item in items if item.get('label') == 'Apply and Respring')
          assert apply_item.get('action') == 'applyAndRespring'

          controller = Path('gif2aniprefs/gif2ani2RootListController.m').read_text()
          picker_start = controller.index('- (void)documentPicker:')
          picker_end = controller.index('- (void)removeGIF', picker_start)
          picker = controller[picker_start:picker_end]
          assert 'G2PendingGIFPath' in picker
          assert 'G2ActiveGIFPath' not in picker
          assert 'postSafeReload' not in picker
          assert 'backboardd was not notified' in picker
          assert 'CFPreferencesSetAppValue(CFSTR("isEnabled"), kCFBooleanFalse' in picker

          apply_start = controller.index('- (void)applyAndRespring')
          apply_code = controller[apply_start:]
          assert 'G2PendingGIFPath' in apply_code
          assert 'G2ActiveGIFPath' in apply_code
          assert 'rename(' in apply_code
          assert '[self postSafeReload]' in apply_code

          tweak = Path('Tweak.xm').read_text()
          reload_start = tweak.index('static void G2Reload')
          reload_end = tweak.index('@interface CADisplay', reload_start)
          reload_code = tweak[reload_start:reload_end]
          assert 'G2LoadGIF' not in reload_code
          assert 'preferences-reloaded-without-media-decode' in reload_code

          start_start = tweak.index('- (void)_startAnimating')
          start_end = tweak.index('- (CALayer *)_prepareContentLayerForPresentation', start_start)
          start_code = tweak[start_start:start_end]
          assert 'G2LoadGIF' in start_code
          assert '%orig' in start_code

          ctor = tweak[tweak.index('%ctor'):]
          assert 'G2LoadGIF' not in ctor
          assert 'tweak-loaded-no-media-decode' in ctor
          assert 'G2LoadSentinelPath' in ctor
          assert 'G2RejectActiveGIF' in ctor
          assert 'G2SetEnabledOnDisk(NO)' in tweak
          assert 'G2MaximumDecodedFrames = 24' in tweak
          assert 'G2MaximumPixelDimension = 640' in tweak
          assert 'G2MaximumEstimatedDecodedBytes = 48ULL' in tweak
          assert 'Respring.gif' not in tweak

          prefs = Path('G2PreferencesManager.m').read_text()
          assert 'return _values[@"isEnabled"] ? [_values[@"isEnabled"] boolValue] : NO;' in prefs

          entry = plistlib.loads(
              Path('package-root/var/jb/Library/PreferenceLoader/Preferences/Gif2Ani.plist').read_bytes()
          )
          assert entry['entry']['bundle'] == 'Gif2AniPrefs'
          print('Validated staged selection, fail-closed defaults, lazy decode, and automatic quarantine')
          PY

      - name: Upload rootless DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.1.0-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.1.0-build-diagnostics
          path: |
            build.log
            package-contents.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish build status
        if: always() && github.event_name == 'push'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p status
          {
            echo "Gif2Ani 3.1.0 Rootless Build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "status=${JOB_STATUS}"
            echo "completed_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "--- build log tail ---"
            if [ -f build.log ]; then tail -n 300 build.log; else echo "build.log missing"; fi
          } > status/build-status.txt
          git add status/build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.1.0 build status [skip ci]"
            git push origin HEAD:main
          fi
