name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[Dark-Boot Build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl zip git libxml2 \
            dpkg-dev unzip xz-utils ca-certificates

      - name: Install Theos, iOS toolchain, and SDKs
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang
          test -x /opt/theos/toolchain/linux/iphone/bin/clang++
          test -n "$(find /opt/theos/sdks -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build and inspect production rootless package
        id: build
        env:
          THEOS: /opt/theos
        run: |
          set -uo pipefail
          : > build.log
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          make_status=${PIPESTATUS[0]}
          set -e
          if [ "$make_status" -ne 0 ]; then
            echo "make_exit_code=$make_status" | tee -a build.log
            exit "$make_status"
          fi

          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          echo "Built $DEB" | tee -a build.log
          dpkg-deb --info "$DEB" 2>&1 | tee -a build.log
          dpkg-deb --contents "$DEB" 2>&1 | tee package-contents.txt | tee -a build.log
          rm -rf package-control
          dpkg-deb -e "$DEB" package-control

          grep -q '^ Version: 2.0.0$' <(dpkg-deb --info "$DEB")
          grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.dylib' package-contents.txt
          grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.plist' package-contents.txt
          grep -q 'var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/DarkBootPrefs' package-contents.txt
          grep -q 'var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/Root.plist' package-contents.txt
          grep -q 'var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist' package-contents.txt
          test -x package-control/postinst
          test -x package-control/prerm
          grep -q 'killall -9 Preferences' package-control/postinst
          grep -q 'sbreload' package-control/postinst

      - name: Upload production DEB
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Boot-2.0-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Boot-build-diagnostics
          path: |
            build.log
            package-contents.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish build status
        if: always() && github.event_name != 'pull_request'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p status
          {
            echo "Dark-Boot Production Rootless DEB Build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "outcome=${BUILD_OUTCOME}"
            echo "completed_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "--- build log tail ---"
            if [ -f build.log ]; then
              tail -n 260 build.log
            else
              echo "No build.log was produced; failure occurred before compilation."
            fi
          } > status/build-status.txt
          git add status/build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Dark-Boot production build status [skip ci]"
            git push origin HEAD:main
          fi
