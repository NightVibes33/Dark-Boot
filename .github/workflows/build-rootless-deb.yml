name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[Dark-Boot Build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld make git curl rsync perl python3 \
            fakeroot dpkg-dev zip unzip xz-utils ca-certificates

      - name: Install Theos and iOS SDKs
        run: |
          set -euo pipefail
          sudo rm -rf /opt/theos /tmp/theos-sdks
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p /opt/theos/sdks
          find /tmp/theos-sdks -maxdepth 1 -type d -name '*.sdk' -exec cp -a {} /opt/theos/sdks/ \;
          test -n "$(find /opt/theos/sdks -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build and inspect rootless package
        id: build
        env:
          THEOS: /opt/theos
        run: |
          set -uo pipefail
          : > build.log
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          make_status=${PIPESTATUS[0]}
          set -e
          if [ "$make_status" -ne 0 ]; then
            echo "make_exit_code=$make_status" | tee -a build.log
            exit "$make_status"
          fi

          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          echo "Built $DEB" | tee -a build.log
          dpkg-deb --info "$DEB" 2>&1 | tee -a build.log
          dpkg-deb --contents "$DEB" 2>&1 | tee package-contents.txt | tee -a build.log
          grep -q 'DarkBoot.dylib' package-contents.txt
          grep -q 'DarkBootPrefs.bundle' package-contents.txt

      - name: Upload DEB
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Boot-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish build status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p status
          {
            echo "Dark-Boot Rootless DEB Build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "outcome=${BUILD_OUTCOME}"
            echo "completed_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "--- build log tail ---"
            if [ -f build.log ]; then
              tail -n 220 build.log
            else
              echo "No build.log was produced; failure occurred before compilation."
            fi
          } > status/build-status.txt
          git add status/build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Dark-Boot build status [skip ci]"
            git push origin HEAD:main
          fi
