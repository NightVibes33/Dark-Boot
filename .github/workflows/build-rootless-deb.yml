name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld make git curl rsync perl python3 \
            fakeroot dpkg-dev zip unzip xz-utils ca-certificates

      - name: Install Theos and iOS SDKs
        run: |
          sudo mkdir -p /opt/theos
          sudo chown -R "$USER:$USER" /opt/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Build rootless package
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          echo "Built $DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee package-contents.txt
          grep -q 'DarkBoot.dylib' package-contents.txt
          grep -q 'DarkBootPrefs.bundle' package-contents.txt

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Boot-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
