name: Build Gif2Ani 3.5.4 Verified Immutable Springy Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gif2ani-354-verified-immutable-springy.yml
      - triggers/build-gif2ani-354-verified-immutable-springy.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-354-verified-immutable-springy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 3.5.4 source
        run: |
          set -euo pipefail
          grep -Fq 'Version: 3.5.4' control
          grep -Fq 'raw.githubusercontent.com/VirenMohindra/CydiaRepo/' gif2aniprefs/G2BundledOpenThemeCatalog.inc
          grep -Fq 'immutable_springy_url' scripts/build_theme_previews.py
          test -s scripts/refresh_immutable_springy_manifest.py
          python3 -m py_compile scripts/refresh_immutable_springy_manifest.py scripts/build_theme_previews.py

      - name: Install build and media dependencies
        env:
          THEOS: /opt/theos
          CI: '1'
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git libxml2 dpkg-dev \
            unzip xz-utils ca-certificates python3 python3-pil file binutils
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Regenerate and verify all 48 immutable Springy records
        run: |
          set -euo pipefail
          python3 scripts/refresh_immutable_springy_manifest.py 2>&1 | tee immutable-manifest.log
          grep -Fq 'immutable_manifest_count=48' immutable-manifest.log
          grep -Fq 'verified 48/48' immutable-manifest.log
          python3 - <<'PY'
          import json
          import pathlib
          import re

          path = pathlib.Path('gif2aniprefs/Resources/OpenThemeCatalog.json')
          manifest = json.loads(path.read_text())
          themes = manifest['themes']
          assert manifest['count'] == len(themes) == 48
          assert manifest['sourceRepository'] == 'VirenMohindra/CydiaRepo'
          assert manifest['sourceLicense'] == 'MIT'
          assert manifest.get('immutableCatalogVerifiedAtUTC', '').endswith('Z')
          assert len({t['identifier'] for t in themes}) == 48
          for theme in themes:
              assert theme['identifier'] == theme['package']
              assert re.fullmatch(r'[0-9a-f]{40}', theme['sourceCommit'])
              assert re.fullmatch(r'[0-9a-f]{64}', theme['sha256'])
              assert 0 < int(theme['bytes']) <= 100 * 1024 * 1024
              expected = f"https://raw.githubusercontent.com/VirenMohindra/CydiaRepo/{theme['sourceCommit']}/{theme['filename'][2:]}"
              assert theme['downloadURL'] == expected
              assert int(theme['immutableVerifiedMediaFiles']) >= 2
          print('regenerated_immutable_manifest=passed')
          PY

      - name: Generate all 102 real thumbnails from verified sources
        run: |
          set -euo pipefail
          python3 scripts/build_theme_previews.py 2>&1 | tee previews.log
          grep -Fq 'generated_previews=102' previews.log
          PREVIEWS='gif2aniprefs/Resources/ThemePreviews'
          test "$(find "$PREVIEWS" -maxdepth 1 -type f -name '*.png' | wc -l)" = 102
          test -s "$PREVIEWS/cyan-pulse-rings.png"
          test -s "$PREVIEWS/io.github.virenmohindra.alone.png"
          python3 - "$PREVIEWS" <<'PY'
          import pathlib, struct, sys
          root = pathlib.Path(sys.argv[1])
          files = sorted(root.glob('*.png'))
          assert len(files) == 102
          for path in files:
              data = path.read_bytes()[:24]
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              assert data[12:16] == b'IHDR', path
              assert struct.unpack('>II', data[16:24]) == (220, 220), path
          print('all_previews_png_220x220=passed')
          PY

      - name: Build and validate rootless 3.5.4 package
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.5.4_iphoneos-arm64.deb' -print -quit)"
          test -s "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nightvibes33.gif2ani'
          test "$(dpkg-deb -f "$DEB" Version)" = '3.5.4'
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64'

          rm -rf verify-root
          dpkg-deb -x "$DEB" verify-root
          BUNDLE='verify-root/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          PREFS="$BUNDLE/Gif2AniPrefs"
          TWEAK='verify-root/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib'
          CATALOG="$BUNDLE/OpenThemeCatalog.json"
          PREVIEWS="$BUNDLE/ThemePreviews"
          test -s "$PREFS" && test -s "$TWEAK" && test -s "$CATALOG"
          file "$PREFS" | grep -Fq 'Mach-O 64-bit arm64'
          strings -a "$PREFS" | grep -Fq 'raw.githubusercontent.com/VirenMohindra/CydiaRepo/'
          strings -a "$PREFS" | grep -Fq 'SHA-256 verification failed'
          test "$(find "$PREVIEWS" -maxdepth 1 -type f -name '*.png' | wc -l)" = 102
          cmp gif2aniprefs/Resources/OpenThemeCatalog.json "$CATALOG"

          mkdir -p release-packages
          cp "$DEB" release-packages/Gif2Ani-3.5.4-verified-immutable-springy.deb
          sha256sum release-packages/Gif2Ani-3.5.4-verified-immutable-springy.deb \
            | tee release-packages/Gif2Ani-3.5.4-verified-immutable-springy.sha256

      - name: Upload DEB and verification logs
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.5.4-verified-immutable-springy
          path: |
            release-packages/Gif2Ani-3.5.4-verified-immutable-springy.deb
            release-packages/Gif2Ani-3.5.4-verified-immutable-springy.sha256
            immutable-manifest.log
            previews.log
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish regenerated catalog, DEB, and status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p status release-packages
          {
            echo 'Gif2Ani 3.5.4 Verified Immutable Springy Catalog'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_commit=${GITHUB_SHA}"
            echo "status=${JOB_STATUS}"
            echo "completed_at_utc=$(date -u +%FT%TZ)"
            cat release-packages/Gif2Ani-3.5.4-verified-immutable-springy.sha256 2>/dev/null || true
            echo 'catalog=48 immutable raw Git DEBs independently downloaded and inspected'
            echo 'checks=effective URL, size, SHA-256, package ID, architecture, extracted artwork'
            echo 'previews=102 real 220x220 PNG thumbnails'
            echo '--- immutable manifest tail ---'
            tail -n 100 immutable-manifest.log 2>/dev/null || true
            echo '--- previews tail ---'
            tail -n 60 previews.log 2>/dev/null || true
            echo '--- build tail ---'
            tail -n 180 build.log 2>/dev/null || true
          } > status/gif2ani-354-verified-immutable-springy.txt

          if [ "$JOB_STATUS" = success ]; then
            git add gif2aniprefs/Resources/OpenThemeCatalog.json
            git add -f release-packages/Gif2Ani-3.5.4-verified-immutable-springy.deb
            git add release-packages/Gif2Ani-3.5.4-verified-immutable-springy.sha256
          fi
          git add status/gif2ani-354-verified-immutable-springy.txt
          git commit -m "Publish Gif2Ani 3.5.4 verified immutable catalog (${JOB_STATUS}) [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
