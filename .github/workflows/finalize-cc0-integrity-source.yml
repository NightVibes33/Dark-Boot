name: Finalize Gif2Ani CC0 Download Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-cc0-integrity-source.yml
      - triggers/finalize-cc0-integrity-source.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-cc0-integrity-source
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add pinned byte and SHA-256 checks to source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gif2aniprefs/G2RemoteThemePreviewOverride.inc')
          text = path.read_text()

          if '#import <CommonCrypto/CommonDigest.h>' not in text:
              text = text.replace('#import <objc/runtime.h>\n', '#import <objc/runtime.h>\n#import <CommonCrypto/CommonDigest.h>\n', 1)

          marker = 'static BOOL G2RemoteCachedThemeIsValid(NSDictionary *pack) {'
          helper = r'''static NSString *G2SHA256StringForData(NSData *data) {
    if (!data.length || data.length > UINT32_MAX) return nil;
    unsigned char digest[CC_SHA256_DIGEST_LENGTH];
    CC_SHA256(data.bytes, (CC_LONG)data.length, digest);
    static const char hex[] = "0123456789abcdef";
    char output[CC_SHA256_DIGEST_LENGTH * 2 + 1];
    for (NSUInteger index = 0; index < CC_SHA256_DIGEST_LENGTH; index++) {
        output[index * 2] = hex[(digest[index] >> 4) & 0x0F];
        output[index * 2 + 1] = hex[digest[index] & 0x0F];
    }
    output[CC_SHA256_DIGEST_LENGTH * 2] = '\0';
    return [NSString stringWithUTF8String:output];
}

static BOOL G2RemoteDataMatchesManifest(NSData *data, NSDictionary *pack, NSError **error) {
    NSNumber *expectedBytes = pack[@"expectedBytes"];
    NSString *expectedSHA256 = [pack[@"sha256"] lowercaseString];
    if (![expectedBytes isKindOfClass:NSNumber.class] || expectedBytes.unsignedLongLongValue == 0 ||
        ![expectedSHA256 isKindOfClass:NSString.class] || expectedSHA256.length != 64) {
        if (error) *error = [NSError errorWithDomain:@"Gif2AniGallery" code:42 userInfo:@{
            NSLocalizedDescriptionKey:@"This downloadable theme is missing its pinned integrity metadata."
        }];
        return NO;
    }
    if (data.length != expectedBytes.unsignedLongLongValue) {
        if (error) *error = [NSError errorWithDomain:@"Gif2AniGallery" code:43 userInfo:@{
            NSLocalizedDescriptionKey:@"The downloaded theme byte count does not match the pinned manifest."
        }];
        return NO;
    }
    NSString *actualSHA256 = G2SHA256StringForData(data);
    if (!actualSHA256 || ![actualSHA256 isEqualToString:expectedSHA256]) {
        if (error) *error = [NSError errorWithDomain:@"Gif2AniGallery" code:44 userInfo:@{
            NSLocalizedDescriptionKey:@"The downloaded theme SHA-256 does not match the pinned manifest."
        }];
        return NO;
    }
    return YES;
}

'''
          if 'static BOOL G2RemoteDataMatchesManifest' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('cache validator marker not found exactly once')
              text = text.replace(marker, helper + marker, 1)

          old_cache = 'if (!data || !G2ValidateGIFData(data, nil)) {'
          new_cache = 'if (!data || !G2RemoteDataMatchesManifest(data, pack, nil) || !G2ValidateGIFData(data, nil)) {'
          if old_cache in text:
              text = text.replace(old_cache, new_cache, 1)

          old_download = '''        NSDictionary *metadata = nil;
        if (!error) metadata = G2ValidateGIFData(data, &error);
        if (!error && metadata) {'''
          new_download = '''        NSDictionary *metadata = nil;
        if (!error && !G2RemoteDataMatchesManifest(data, pack, &error)) metadata = nil;
        if (!error) metadata = G2ValidateGIFData(data, &error);
        if (!error && metadata) {'''
          if old_download in text:
              text = text.replace(old_download, new_download, 1)

          required = [
              '#import <CommonCrypto/CommonDigest.h>',
              'static BOOL G2RemoteDataMatchesManifest',
              'CC_SHA256',
              'G2RemoteDataMatchesManifest(data, pack, nil)',
              'G2RemoteDataMatchesManifest(data, pack, &error)',
              'SHA-256 does not match the pinned manifest',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'missing integrity tokens: {missing}')
          path.write_text(text)
          PY

      - name: Validate source patch
        run: |
          set -euo pipefail
          grep -Fq '#import <CommonCrypto/CommonDigest.h>' gif2aniprefs/G2RemoteThemePreviewOverride.inc
          grep -Fq 'G2RemoteDataMatchesManifest(data, pack, nil)' gif2aniprefs/G2RemoteThemePreviewOverride.inc
          grep -Fq 'G2RemoteDataMatchesManifest(data, pack, &error)' gif2aniprefs/G2RemoteThemePreviewOverride.inc
          grep -Fq 'The downloaded theme SHA-256 does not match the pinned manifest.' gif2aniprefs/G2RemoteThemePreviewOverride.inc

      - name: Commit integrity enforcement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gif2aniprefs/G2RemoteThemePreviewOverride.inc
          git commit -m 'Enforce pinned integrity for all 54 CC0 theme downloads' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
