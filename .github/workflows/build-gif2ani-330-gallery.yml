name: Build Gif2Ani 3.3.0 Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/build-gif2ani-330-gallery.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and Theos
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git \
            libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Validate gallery source contract
        run: |
          set -euo pipefail
          test "$(awk '/^Version:/{print $2}' control)" = "3.3.0"
          test -f gif2aniprefs/G2ThemeGalleryController.m
          test -f gif2aniprefs/G2ThemeGalleryController.h
          grep -q 'G2ThemeGalleryController.m' gif2aniprefs/Makefile
          grep -q 'G2ThemeGalleryController' gif2aniprefs/Resources/Root.plist
          grep -q 'Browse and Preview Animations' gif2aniprefs/Resources/Root.plist
          grep -q 'G2BuiltInPacks' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'G2LegacyCatalog' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'UIDocumentPickerViewController' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'dpkg-deb' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'unzip' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'Springy' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'SnowBoard' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'Stage This Animation' gif2aniprefs/G2ThemeGalleryController.m
          python3 - <<'PY'
          from pathlib import Path
          text=Path('gif2aniprefs/G2ThemeGalleryController.m').read_text()
          built=text[text.index('G2BuiltInPacks'):text.index('G2LegacyCatalog')]
          assert built.count('@{"identifier"') == 12, built.count('@{"identifier"')
          legacy=text[text.index('G2LegacyCatalog'):text.index('static UIColor *G2RGB')]
          assert legacy.count('@{"name"') >= 35, legacy.count('@{"name"')
          assert 'CGImageDestinationCreateWithURL' in text
          assert 'G2ValidateGIFData' in text
          print('gallery_source_contract=success')
          PY

      - name: Build rootless DEB
        id: compile
        env:
          THEOS: /opt/theos
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build-330-gallery.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.3.0_iphoneos-arm64.deb' | head -n1)"
          test -n "$DEB"
          echo "$DEB" > deb-path-330.txt
          test "$(dpkg-deb --field "$DEB" Package)" = "com.nightvibes33.gif2ani"
          test "$(dpkg-deb --field "$DEB" Version)" = "3.3.0"
          rm -rf package-root-330
          dpkg-deb -x "$DEB" package-root-330
          BUNDLE=package-root-330/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle
          test -f "$BUNDLE/Gif2AniPrefs"
          test -f "$BUNDLE/Root.plist"
          strings "$BUNDLE/Gif2AniPrefs" | grep -q 'Pulse Rings'
          strings "$BUNDLE/Gif2AniPrefs" | grep -q 'Rotating Cube'
          strings "$BUNDLE/Gif2AniPrefs" | grep -q 'Stage This Animation'
          strings "$BUNDLE/Gif2AniPrefs" | grep -q 'Import GIF, ZIP, DEB, or Frame Folder'
          grep -q 'G2ThemeGalleryController' "$BUNDLE/Root.plist"
          dpkg-deb --contents "$DEB" | tee package-contents-330.txt
          sha256sum "$DEB" | tee deb-sha256-330.txt

      - name: Upload gallery DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.3.0-gallery-rootless-deb
          path: packages/com.nightvibes33.gif2ani_3.3.0_iphoneos-arm64.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish gallery build status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p status
          {
            echo "Gif2Ani 3.3.0 Gallery Build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "status=${JOB_STATUS}"
            echo
            cat deb-sha256-330.txt 2>/dev/null || true
            echo
            echo "--- package contents ---"
            cat package-contents-330.txt 2>/dev/null || true
            echo
            echo "--- build log tail ---"
            tail -n 350 build-330-gallery.log 2>/dev/null || true
          } > status/build-330-gallery.txt
          git add status/build-330-gallery.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.3.0 gallery build [skip ci]"
            git push origin HEAD:main
          fi
