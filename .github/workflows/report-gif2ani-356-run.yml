name: Report Gif2Ani 3.5.6 Build Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-gif2ani-356-run.yml
      - triggers/report-gif2ani-356-run.txt

permissions:
  actions: read
  contents: write

concurrency:
  group: report-gif2ani-356-run
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest build workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/actions/workflows/build-gif2ani-356-snowboard-library.yml/runs?per_page=10"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" > runs.json
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          data=json.loads(pathlib.Path('runs.json').read_text())
          runs=data.get('workflow_runs', [])
          selected=runs[0] if runs else None
          lines=['Gif2Ani 3.5.6 Active Build Reporter']
          if selected is None:
              lines.append('run=not_found')
          else:
              for key in ('id','head_sha','status','conclusion','event','created_at','updated_at','run_attempt','html_url'):
                  lines.append(f"{key}={selected.get(key)}")
              req=urllib.request.Request(
                  selected['jobs_url']+'?per_page=100',
                  headers={
                      'Accept':'application/vnd.github+json',
                      'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'Gif2Ani-status-reporter',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  jobs=json.load(response).get('jobs', [])
              for job in jobs:
                  lines.append(f"job={job.get('id')}|{job.get('name')}|{job.get('status')}|{job.get('conclusion')}")
                  for step in job.get('steps', []):
                      lines.append(f"step={step.get('number')}|{step.get('name')}|{step.get('status')}|{step.get('conclusion')}")
          pathlib.Path('status/gif2ani-356-active-run.txt').parent.mkdir(parents=True,exist_ok=True)
          pathlib.Path('status/gif2ani-356-active-run.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Publish report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add status/gif2ani-356-active-run.txt
          git commit -m 'Report Gif2Ani 3.5.6 active build [skip ci]' || exit 0
          git push origin HEAD:main
