name: Fix Gif2Ani 3.4.1 Theme Validation V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-build-341-open-library-v2.yml
      - triggers/fix-build-341-open-library-v2.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-341-theme-validation-v2
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current build workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-gif2ani-340.yml')
          text = path.read_text()

          def add_after(anchor, addition, label):
              global text
              if addition.strip() in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{label}: anchor count={text.count(anchor)}')
              text = text.replace(anchor, anchor + addition, 1)

          add_after(
              '          test -f gif2aniprefs/G2OpenThemeLibrary.inc\n',
              '          test -f gif2aniprefs/G2BundledOpenThemeCatalog.inc\n',
              'bundled catalog source validation')
          add_after(
              '          test -f gif2aniprefs/Resources/ThemeCatalog.json\n',
              '          test -f gif2aniprefs/Resources/OpenThemeCatalog.json\n',
              'open manifest source validation')

          if "open_manifest=json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())" not in text:
              anchor = "          manifest=json.loads(Path('gif2aniprefs/Resources/ThemeCatalog.json').read_text())\n          assert len(manifest['themes']) == 54\n"
              replacement = "          manifest=json.loads(Path('gif2aniprefs/Resources/ThemeCatalog.json').read_text())\n          open_manifest=json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())\n          assert manifest['count'] == len(manifest['themes']) == 54\n          assert open_manifest['count'] == len(open_manifest['themes']) == 48\n          assert open_manifest['sourceRepository'] == 'VirenMohindra/CydiaRepo'\n          assert open_manifest['sourceLicense'] == 'MIT'\n"
              if text.count(anchor) != 1:
                  raise SystemExit('manifest assertion anchor not found exactly once')
              text = text.replace(anchor, replacement, 1)

          text = text.replace(
              "['G2RemoteThemeCatalog.inc','G2OpenThemeLibrary.inc','G2RemoteThemePreviewOverride.inc','G2RemoteGalleryPolish.inc']",
              "['G2RemoteThemeCatalog.inc','G2OpenThemeLibrary.inc','G2BundledOpenThemeCatalog.inc','G2RemoteThemePreviewOverride.inc','G2RemoteGalleryPolish.inc']")
          text = text.replace(
              "          print('source_backed_open_library_minimum=40')\n",
              "          print('source_backed_open_library_themes=48')\n          print('total_downloadable_built_ins=102')\n")

          add_after(
              '          test -f "$BUNDLE/ThemeCatalog.json"\n',
              '          test -f "$BUNDLE/OpenThemeCatalog.json"\n',
              'packaged open manifest')

          pattern = re.compile(
              r'''          strings "\$BUNDLE/Gif2AniPrefs" \| grep -q 'SHA-256 does not match the pinned manifest'\n'''
              r'''          strings "\$BUNDLE/Gif2AniPrefs" \| grep -q 'Open Source Pack Library'\n'''
              r'''          python3 - "\$BUNDLE/ThemeCatalog.json" <<'PY'\n'''
              r'''          import json,sys\n'''
              r'''          data=json.load\(open\(sys.argv\[1\]\)\)\n'''
              r'''          assert data\['count'\]==54 and len\(data\['themes'\]\)==54\n'''
              r'''          print\('packaged_theme_manifest=success'\)\n'''
              r'''          PY\n''')
          replacement = '''          strings "$BUNDLE/Gif2AniPrefs" > bundle-strings-341.txt
          grep -Fq 'SHA-256 does not match the pinned manifest' bundle-strings-341.txt
          grep -Fq 'Open Source Pack Library' bundle-strings-341.txt
          grep -Fq 'Original Springy pack' bundle-strings-341.txt
          python3 - "$BUNDLE/ThemeCatalog.json" "$BUNDLE/OpenThemeCatalog.json" <<'PY'
          import json,sys
          built_in=json.load(open(sys.argv[1]))
          open_source=json.load(open(sys.argv[2]))
          assert built_in['count'] == len(built_in['themes']) == 54
          assert open_source['count'] == len(open_source['themes']) == 48
          assert len({item['package'] for item in open_source['themes']}) == 48
          assert all(item['sourceLicense'] == 'MIT' for item in open_source['themes'])
          print('packaged_cc0_theme_manifest=54')
          print('packaged_open_theme_manifest=48')
          print('packaged_downloadable_total=102')
          PY
'''
          if 'packaged_downloadable_total=102' not in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'packaged validation replacement count={count}')

          required = [
              'G2BundledOpenThemeCatalog.inc',
              'OpenThemeCatalog.json',
              "open_manifest['count'] == len(open_manifest['themes']) == 48",
              'bundle-strings-341.txt',
              'packaged_downloadable_total=102',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'missing final validation tokens: {missing}')
          if '| grep -q' in '\n'.join(line for line in text.splitlines() if 'Gif2AniPrefs' in line or 'bundle-strings' in line):
              raise SystemExit('pipefail-sensitive binary strings validation still exists')

          path.write_text(text)
          PY

      - name: Commit deterministic build validation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-gif2ani-340.yml
          git commit -m 'Validate all 102 downloadable Gif2Ani themes' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p status
          {
            echo 'Gif2Ani 3.4.1 Theme Validation V2'
            echo "run_id=${GITHUB_RUN_ID}"
            echo 'status=failure'
          } > status/build-validation-v2.txt
          git add status/build-validation-v2.txt
          git commit -m 'Record theme validation V2 failure [skip ci]' || exit 0
          git push origin HEAD:main
