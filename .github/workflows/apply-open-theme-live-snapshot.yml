name: Apply Verified Open Theme Live Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-open-theme-live-snapshot.yml
      - scripts/apply_open_theme_live_snapshot.py
      - triggers/apply-open-theme-live-snapshot.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-apply-open-theme-live-snapshot
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install package inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl dpkg-dev python3 ca-certificates

      - name: Apply and verify complete 48-pack snapshot
        run: |
          set -euo pipefail
          python3 scripts/apply_open_theme_live_snapshot.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())
          assert data['count'] == len(data['themes']) == 48
          assert data['liveSnapshotCount'] == 48
          assert data['repositoryIndexMismatchCount'] == 47
          assert data['missingPagesPayloadFallbackCount'] == 1
          assert all(item['verifiedMediaFiles'] >= 1 for item in data['themes'])
          assert sum(item['package'] == 'io.github.virenmohindra.swish' for item in data['themes']) == 1
          print('final_verified_springy_packs=48')
          PY

      - name: Commit verified catalog and source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gif2aniprefs/Resources/OpenThemeCatalog.json
          git add gif2aniprefs/G2OpenThemeLibrary.inc
          git add .github/workflows/build-gif2ani-340.yml
          git add status/open-theme-live-audit.txt
          git commit -m 'Pin all 48 verified Springy theme payloads [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
