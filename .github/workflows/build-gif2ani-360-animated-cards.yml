name: Build Gif2Ani 3.6.0 Animated Gallery Cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gif2ani-360-animated-cards.yml
      - scripts/apply_gif2ani_360_animated_gallery_cards.py
      - triggers/build-gif2ani-360-animated-cards.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-360-animated-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies and Theos
        env:
          THEOS: /opt/theos
          CI: '1'
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git libxml2 dpkg-dev \
            unzip xz-utils ca-certificates python3 file binutils
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Apply animated card patch
        run: |
          set -euo pipefail
          python3 scripts/apply_gif2ani_360_animated_gallery_cards.py | tee source-fix.log
          grep -Fq 'gif2ani_360_animated_gallery_cards=success' source-fix.log
          grep -Fq 'visible_only_animation=enabled' source-fix.log
          grep -Fq 'Version: 3.6.0' control
          grep -Fq 'GIF2ANI 3.6.0' gif2aniprefs/Resources/Root.plist
          grep -Fq 'visible-card-bundled-animation-v360' gif2aniprefs/G2ModernGallery.inc
          grep -Fq 'didEndDisplayingCell' gif2aniprefs/G2ModernGallery.inc
          grep -Fq 'totalCostLimit = 12 * 1024 * 1024' gif2aniprefs/G2ModernGallery.inc
          echo 'animated_card_source_gate=passed'

      - name: Validate bundled preview inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('gif2aniprefs/Resources/ThemePreviewAnimations')
          manifest=json.loads(pathlib.Path('gif2aniprefs/Resources/ThemePreviewAnimations.json').read_text())
          files=list(root.glob('*.gif'))
          assert manifest['count']==262
          assert len(manifest['previews'])==262
          assert len(files)==262
          for record in manifest['previews']:
              path=root/f"{record['identifier']}.gif"
              assert path.is_file()
              assert path.stat().st_size==record['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==record['sha256']
          print(f"preview_inventory_gate=passed|count={len(files)}|bytes={manifest['totalBytes']}")
          PY

      - name: Compile and verify rootless package
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.6.0_iphoneos-arm64.deb' -print -quit)"
          test -s "$DEB"
          test "$(dpkg-deb -f "$DEB" Package | tr -d '\r\n')" = 'com.nightvibes33.gif2ani'
          test "$(dpkg-deb -f "$DEB" Version | tr -d '\r\n')" = '3.6.0'
          test "$(dpkg-deb -f "$DEB" Architecture | tr -d '\r\n')" = 'iphoneos-arm64'

          rm -rf verify-root
          dpkg-deb -x "$DEB" verify-root
          BUNDLE='verify-root/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          PREFS="$BUNDLE/Gif2AniPrefs"
          TWEAK='verify-root/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib'
          test -s "$PREFS" && test -s "$TWEAK"
          file "$PREFS" | grep -Fq 'Mach-O 64-bit arm64'
          file "$TWEAK" | grep -Fq 'Mach-O 64-bit arm64'
          grep -Fq 'GIF2ANI 3.6.0' "$BUNDLE/Root.plist"
          grep -Fq '274-THEME ANIMATION GALLERY' "$BUNDLE/Root.plist"
          test -s "$BUNDLE/ThemePreviewAnimations.json"
          test "$(find "$BUNDLE/ThemePreviewAnimations" -maxdepth 1 -type f -name '*.gif' | wc -l | tr -d ' ')" = '262'
          strings -a "$PREFS" > prefs-strings.txt
          grep -Fq 'visible-card-bundled-animation-v360' prefs-strings.txt
          grep -Fq '/var/jb/usr/bin:/var/jb/usr/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin' prefs-strings.txt

          python3 - "$BUNDLE/ThemePreviewAnimations.json" "$BUNDLE/ThemePreviewAnimations" <<'PY'
          import hashlib,json,pathlib,sys
          manifest=json.loads(pathlib.Path(sys.argv[1]).read_text())
          root=pathlib.Path(sys.argv[2])
          assert manifest['count']==262
          assert len(list(root.glob('*.gif')))==262
          for record in manifest['previews']:
              path=root/f"{record['identifier']}.gif"
              assert path.is_file()
              assert path.stat().st_size==record['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==record['sha256']
          print('packaged_animated_card_resources=passed|count=262')
          PY

          mkdir -p release-packages
          cp "$DEB" release-packages/Gif2Ani-3.6.0-animated-gallery-cards.deb
          sha256sum release-packages/Gif2Ani-3.6.0-animated-gallery-cards.deb \
            | tee release-packages/Gif2Ani-3.6.0-animated-gallery-cards.sha256
          echo 'gif2ani_360_package_gate=passed'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.6.0-animated-gallery-cards
          path: |
            release-packages/Gif2Ani-3.6.0-animated-gallery-cards.deb
            release-packages/Gif2Ani-3.6.0-animated-gallery-cards.sha256
            source-fix.log
            build.log
            prefs-strings.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish package and status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p status release-packages
          {
            echo 'Gif2Ani 3.6.0 Animated Gallery Cards'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "source_commit=${GITHUB_SHA}"
            echo "status=${JOB_STATUS}"
            echo "completed_at_utc=$(date -u +%FT%TZ)"
            cat release-packages/Gif2Ani-3.6.0-animated-gallery-cards.sha256 2>/dev/null || true
            echo 'gallery_total=274'
            echo 'animated_downloadable_card_previews=262'
            echo 'visible_only_decoding=true'
            echo 'offscreen_frame_release=true'
            echo 'decoded_cache_limit_bytes=12582912'
            echo '--- source ---'
            cat source-fix.log 2>/dev/null || true
            echo '--- build tail ---'
            tail -n 180 build.log 2>/dev/null || true
          } > status/gif2ani-360-animated-gallery-cards.txt

          if [ "$JOB_STATUS" = success ]; then
            git add control gif2aniprefs/G2ModernGallery.inc gif2aniprefs/Resources/Root.plist
            git add -f release-packages/Gif2Ani-3.6.0-animated-gallery-cards.deb
            git add release-packages/Gif2Ani-3.6.0-animated-gallery-cards.sha256
          fi
          git add status/gif2ani-360-animated-gallery-cards.txt
          git commit -m "Publish Gif2Ani 3.6.0 animated gallery cards (${JOB_STATUS}) [skip ci]" || true
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1
