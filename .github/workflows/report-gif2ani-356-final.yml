name: Report Final Gif2Ani 3.5.6 Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-gif2ani-356-final.yml
      - triggers/report-gif2ani-356-final.txt

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read final build status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/build-gif2ani-356-final.yml/runs?per_page=5" > runs.json
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          runs=json.loads(pathlib.Path('runs.json').read_text()).get('workflow_runs',[])
          lines=['Gif2Ani 3.5.6 Final Workflow Reporter',f"report_run={os.environ.get('GITHUB_RUN_ID','')}"]
          if not runs:
              lines.append('run=not_found')
          else:
              run=runs[0]
              for key in ('id','head_sha','status','conclusion','created_at','updated_at','html_url'):
                  lines.append(f"{key}={run.get(key)}")
              req=urllib.request.Request(run['jobs_url']+'?per_page=100',headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'Gif2Ani-final-reporter',
              })
              with urllib.request.urlopen(req,timeout=30) as response:
                  jobs=json.load(response).get('jobs',[])
              for job in jobs:
                  lines.append(f"job={job.get('id')}|{job.get('name')}|{job.get('status')}|{job.get('conclusion')}")
                  for step in job.get('steps',[]):
                      lines.append(f"step={step.get('number')}|{step.get('name')}|{step.get('status')}|{step.get('conclusion')}")
          pathlib.Path('status').mkdir(exist_ok=True)
          pathlib.Path('status/gif2ani-356-final-run.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Publish report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add status/gif2ani-356-final-run.txt
          git commit -m 'Report final Gif2Ani 3.5.6 run [skip ci]' || exit 0
          git push origin HEAD:main
