name: Apply Gif2Ani Theme Gallery V2 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/apply-theme-gallery-v2-source.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode hardened gallery source
        env:
          SOURCE_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64,gzip,os
          data=gzip.decompress(base64.b64decode(os.environ['SOURCE_GZ_B64']))
          path='gif2aniprefs/G2ThemeGalleryController.m'
          open(path,'wb').write(data)
          print(path,len(data))
          PY
          grep -q 'G2PreflightArchive' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'G2WriteGalleryPreferences' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'Preparing bounded preview' gif2aniprefs/G2ThemeGalleryController.m
          grep -q 'Import GIF, ZIP, DEB, or Frame Folder' gif2aniprefs/G2ThemeGalleryController.m
      - name: Commit hardened gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gif2aniprefs/G2ThemeGalleryController.m
          git commit -m "Harden and optimize Gif2Ani animation gallery" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
