name: Report Gif2Ani 3.5.6 State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-gif2ani-356-state.yml
      - triggers/report-gif2ani-356-state.txt

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest 3.5.6 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          workflow = 'build-gif2ani-356-snowboard-library.yml'
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=10'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          lines = ['Gif2Ani 3.5.6 Workflow State']
          for run in payload.get('workflow_runs', []):
              lines.extend([
                  f"run_id={run.get('id')}",
                  f"head_sha={run.get('head_sha')}",
                  f"event={run.get('event')}",
                  f"status={run.get('status')}",
                  f"conclusion={run.get('conclusion')}",
                  f"created_at={run.get('created_at')}",
                  f"updated_at={run.get('updated_at')}",
                  f"url={run.get('html_url')}",
                  '---',
              ])
          open('status/gif2ani-356-run-state.txt', 'w').write('\n'.join(lines) + '\n')
          PY
      - name: Publish state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add status/gif2ani-356-run-state.txt
          git commit -m 'Record Gif2Ani 3.5.6 workflow state [skip ci]' || exit 0
          git push origin HEAD:main
