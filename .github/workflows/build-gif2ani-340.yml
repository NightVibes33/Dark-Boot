name: Build Gif2Ani 3.4.1 Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gif2ani-340.yml
      - triggers/build-gif2ani-340.txt
      - control
      - Makefile
      - Tweak.xm
      - gif2aniprefs/**

permissions:
  contents: write

concurrency:
  group: gif2ani-341-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies and Theos
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git \
            libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Fetch pinned Gif2Ani CC0 manifest
        run: |
          set -euo pipefail
          mkdir -p gif2aniprefs/Resources
          curl -fsSL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/b5d5eda04359409865772038895e660d709deb18/gif2ani-themes/v1/manifest.json' \
            -o gif2aniprefs/Resources/ThemeCatalog.json

      - name: Validate 114-theme source contract
        run: |
          set -euo pipefail
          test "$(awk '/^Version:/{print $2}' control)" = "3.4.1"
          test -f gif2aniprefs/G2ThemeGalleryController.m
          test -f gif2aniprefs/G2RemoteThemeCatalog.inc
          test -f gif2aniprefs/G2OpenThemeLibrary.inc
          test -f gif2aniprefs/G2BundledOpenThemeCatalog.inc
          test -f gif2aniprefs/G2RemoteThemePreviewOverride.inc
          test -f gif2aniprefs/G2RemoteGalleryPolish.inc
          test -f gif2aniprefs/G2ThemeStageOverride.inc
          test -f gif2aniprefs/Resources/ThemeCatalog.json
          test -f gif2aniprefs/Resources/OpenThemeCatalog.json
          grep -q 'G2ThemeGalleryController.m' gif2aniprefs/Makefile
          grep -q 'G2ThemeGalleryController' gif2aniprefs/Resources/Root.plist
          grep -q '114-THEME ANIMATION GALLERY' gif2aniprefs/Resources/Root.plist
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          wrapper = Path('gif2aniprefs/G2ThemeGalleryController.m').read_text()
          catalog = Path('gif2aniprefs/G2RemoteThemeCatalog.inc').read_text()
          preview = Path('gif2aniprefs/G2RemoteThemePreviewOverride.inc').read_text()
          openlib = Path('gif2aniprefs/G2OpenThemeLibrary.inc').read_text()
          bundled = Path('gif2aniprefs/G2BundledOpenThemeCatalog.inc').read_text()
          stage = Path('gif2aniprefs/G2ThemeStageOverride.inc').read_text()
          cc0 = json.loads(Path('gif2aniprefs/Resources/ThemeCatalog.json').read_text())
          springy = json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())

          assert cc0['version'] == 1
          assert cc0['count'] == len(cc0['themes']) == 54
          cc0_ids = set()
          for item in cc0['themes']:
              assert re.fullmatch(r'[a-z0-9-]+', item['id'])
              assert item['id'] not in cc0_ids
              cc0_ids.add(item['id'])
              assert item['file'] == item['id'] + '.gif'
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
              assert 0 < int(item['bytes']) <= 25 * 1024 * 1024
              assert item['sourceFrames'] == 24
              assert item['width'] == 360 and item['height'] == 360
              assert item['license'] == 'CC0-1.0'

          assert springy['version'] == 1
          assert springy['count'] == len(springy['themes']) == 48
          assert springy['sourceRepository'] == 'VirenMohindra/CydiaRepo'
          assert springy['sourceLicense'] == 'MIT'
          packages = set()
          for item in springy['themes']:
              assert item['package'] == item['identifier']
              assert item['package'].startswith('io.github.virenmohindra.')
              assert item['package'] not in packages
              packages.add(item['package'])
              assert item['downloadURL'].startswith('https://virenmohindra.github.io/debs/')
              assert re.fullmatch(r'[0-9a-f]{64}', item['sha256'])
              assert 0 < int(item['bytes']) <= 100 * 1024 * 1024
              assert item['sourceLicense'] == 'MIT'

          required_includes = [
              'G2RemoteThemeCatalog.inc',
              'G2OpenThemeLibrary.inc',
              'G2BundledOpenThemeCatalog.inc',
              'G2RemoteThemePreviewOverride.inc',
              'G2RemoteGalleryPolish.inc',
          ]
          for name in required_includes:
              assert f'#include "{name}"' in wrapper, name

          assert 'expectedBytes' in catalog and '@"sha256"' in catalog
          assert 'G2RemoteDataMatchesManifest' in preview and 'CC_SHA256' in preview
          assert 'G2OpenThemePacksFromIndexData' in openlib
          assert 'G2PreflightArchive' in openlib and 'G2ValidateExtractedTree' in openlib
          assert 'SHA-256 verification failed' in openlib
          assert 'G2BundledOpenThemeCatalog' in bundled
          assert 'G2WriteGalleryPreferences(@{@"pendingReady":@YES}' in stage
          assert 12 + cc0['count'] + springy['count'] == 114
          assert cc0['count'] + springy['count'] == 102
          print('offline_themes=12')
          print('cc0_downloadable_themes=54')
          print('source_backed_springy_themes=48')
          print('downloadable_theme_total=102')
          print('first_class_theme_total=114')
          print('gif2ani_341_source_contract=success')
          PY

      - name: Build rootless DEB
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build-341.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.4.1_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          echo "$DEB" > deb-path-341.txt
          dpkg-deb --contents "$DEB" | tee package-contents-341.txt
          sha256sum "$DEB" | tee deb-sha256-341.txt
          test "$(dpkg-deb --field "$DEB" Package)" = "com.nightvibes33.gif2ani"
          test "$(dpkg-deb --field "$DEB" Version)" = "3.4.1"
          test "$(dpkg-deb --field "$DEB" Architecture)" = "iphoneos-arm64"

          rm -rf package-root-341
          dpkg-deb -x "$DEB" package-root-341
          BUNDLE="$(find package-root-341 -type d -name 'Gif2AniPrefs.bundle' -print -quit)"
          test -n "$BUNDLE"
          test -s "$BUNDLE/Gif2AniPrefs"
          test -f "$BUNDLE/Root.plist"
          test -f "$BUNDLE/ThemeCatalog.json"
          test -f "$BUNDLE/OpenThemeCatalog.json"
          test -f package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib
          test -f package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist
          grep -Fq '<string>GIF2ANI 3.4.1</string>' "$BUNDLE/Root.plist"
          grep -Fq '114-THEME ANIMATION GALLERY' "$BUNDLE/Root.plist"
          grep -Fq 'Browse and Preview Animations' "$BUNDLE/Root.plist"

          strings "$BUNDLE/Gif2AniPrefs" > bundle-strings-341.txt
          grep -Fq 'SHA-256 does not match the pinned manifest' bundle-strings-341.txt
          grep -Fq 'Open Source Pack Library' bundle-strings-341.txt
          grep -Fq 'Original Springy pack' bundle-strings-341.txt

          python3 - "$BUNDLE/ThemeCatalog.json" "$BUNDLE/OpenThemeCatalog.json" <<'PY'
          import json, sys
          cc0 = json.load(open(sys.argv[1]))
          springy = json.load(open(sys.argv[2]))
          assert cc0['count'] == len(cc0['themes']) == 54
          assert springy['count'] == len(springy['themes']) == 48
          assert len({item['package'] for item in springy['themes']}) == 48
          assert cc0['count'] + springy['count'] == 102
          print('packaged_cc0_theme_manifest=54')
          print('packaged_open_theme_manifest=48')
          print('packaged_downloadable_total=102')
          PY

          file "$BUNDLE/Gif2AniPrefs" \
               package-root-341/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib \
               | tee packaged-binaries-341.txt

      - name: Upload Gif2Ani 3.4.1 DEB
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.4.1-rootless-deb
          path: packages/com.nightvibes33.gif2ani_3.4.1_iphoneos-arm64.deb
          if-no-files-found: error
          retention-days: 30

      - name: Commit pinned CC0 manifest
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gif2aniprefs/Resources/ThemeCatalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Bundle verified 54-theme CC0 manifest [skip ci]"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish build status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p status
          {
            echo "Gif2Ani 3.4.1 Gallery Build"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "status=${JOB_STATUS}"
            echo "completed_at_utc=$(date -u +%FT%TZ)"
            echo "offline_themes=12"
            echo "cc0_downloadable_themes=54"
            echo "source_backed_springy_themes=48"
            echo "downloadable_theme_total=102"
            echo "first_class_theme_total=114"
            echo
            cat deb-sha256-341.txt 2>/dev/null || true
            echo
            echo "--- packaged binaries ---"
            cat packaged-binaries-341.txt 2>/dev/null || true
            echo
            echo "--- package contents ---"
            cat package-contents-341.txt 2>/dev/null || true
            echo
            echo "--- build log tail ---"
            tail -n 350 build-341.log 2>/dev/null || true
          } > status/build-341.txt
          git add status/build-341.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.4.1 build [skip ci]"
            git push origin HEAD:main
          fi
